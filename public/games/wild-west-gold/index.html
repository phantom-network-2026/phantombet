<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="/games/pirate-bay/">
<title>Wild West Gold</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<style>
  body {
    background: radial-gradient(ellipse at center, #4a1a08 0%, #150402 100%);
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    padding: 0; margin: 0;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(251,146,60,0.22), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(180,40,30,0.20), transparent 45%),
      repeating-linear-gradient(90deg, rgba(251,146,60,0.05) 0 2px, transparent 2px 18px);
    pointer-events: none;
    z-index: 3;
  }
  canvas {
    display: block;
    margin: 0;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    filter: hue-rotate(345deg) saturate(1.5) sepia(0.4) contrast(1.1);
    z-index: 2;
  }
  .corner {
    position: fixed; width: 90px; height: 90px;
    background: url("/games/wild-west-gold/emblem.png") center/contain no-repeat;
    opacity: 0.85;
    filter: drop-shadow(0 0 10px #fb923c);
    z-index: 5; pointer-events: none;
  }
  .corner.tl { top: 60px; left: 8px; }
  .corner.tr { top: 60px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 8px; left: 8px; opacity: 0.5; }
  .corner.br { bottom: 8px; right: 8px; opacity: 0.5; transform: scaleX(-1); }
  .watermark {
    position: fixed; inset: 0;
    background: url("/games/wild-west-gold/emblem.png") center/40% no-repeat;
    opacity: 0.07; z-index: 1; pointer-events: none;
  }
  #clone-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    font-family: "Rye", "Trebuchet MS", serif;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 6px;
    color: #ffcf8a;
    text-shadow: 0 0 14px #fb923c, 0 0 4px #000, 2px 2px 0 #2a0a02;
    pointer-events: none;
    text-transform: uppercase;
    background: linear-gradient(180deg, rgba(40,10,5,0.85), rgba(40,10,5,0));
    border-bottom: 2px solid rgba(251,146,60,0.4);
  }
</style>
<script src="js/phaser.js"></script>
<script src="../bridge.js"></script>
<script>window.__PB_CLONE_TITLE__ = "Wild West Gold";</script>
</head>
<body>
  <div class="watermark"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="clone-banner">Wild West Gold</div>
  <script src="js/slotConfig3x5.js"></script>
  <script src="js/mkutils.js"></script>
  <script src="js/popups.js"></script>
  <script src="js/state_machine.js"></script>
  <script src="js/slot_classes.js"></script>
  <script src="js/slotGame.js"></script>
  <script src="phantom-bridge-integration.js"></script>
</body>
</html>
