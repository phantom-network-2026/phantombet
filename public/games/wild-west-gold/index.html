<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="/games/pirate-bay/">
<title>Wild West Gold</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<style>
  html, body {
    width: 100%; height: 100%;
    padding: 0; margin: 0;
    overflow: hidden;
    position: relative;
    background: #000 url("/games/wild-west-gold/background.jpg") center/cover no-repeat fixed;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.35));
    pointer-events: none;
    z-index: 3;
  }
  /* Stage scaler — zooms canvas+UI on mobile so controls are reachable */
  #stage {
    position: fixed; inset: 0;
    transform-origin: center center;
    z-index: 2;
  }
  canvas {
    display: block;
    margin: 0;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    filter: hue-rotate(345deg) saturate(1.5) sepia(0.4) contrast(1.1);
  }
  /* Themed faint emblem watermark behind reels */
  .watermark {
    position: fixed; inset: 0;
    background: url("/games/wild-west-gold/emblem.png") center/35% no-repeat;
    opacity: 0.08; z-index: 1; pointer-events: none;
  }
  #clone-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    font-family: "Rye","Trebuchet MS",serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 5px;
    color: #ffcf8a;
    text-shadow: 0 0 14px #fb923c, 0 0 4px #000, 2px 2px 0 #2a0a02;
    pointer-events: none;
    text-transform: uppercase;
    background: linear-gradient(180deg, #2a0a02cc, transparent);
    border-bottom: 2px solid #fb923c66;
  }
  /* Mobile: scale the entire stage up so reels & buttons are bigger */
  @media (max-width: 600px) {
    #stage { transform: scale(1.25); }
    #clone-banner { font-size: 18px; height: 40px; letter-spacing: 4px; }
  }
  @media (max-width: 420px) {
    #stage { transform: scale(1.4); }
  }
</style>
<script src="js/phaser.js"></script>
<script src="../bridge.js"></script>
<script>window.__PB_CLONE_TITLE__ = "Wild West Gold";</script>
<script>window.__PB_LOADER__={title:"WILD WEST GOLD",subtitle:"Loading the six-shooters…",emojis:["🤠","🌵","🐎","💰"],bg:"radial-gradient(ellipse at center,#5a2a0a 0%,#1a0a02 100%)",accent:"#fbbf24",accent2:"#b45309",font:'"Rye","Trebuchet MS",serif',emblem:"/games/wild-west-gold/emblem.png"};</script>
<script src="loader.js"></script>
</head>
<body>
  <div class="watermark"></div>
  <div id="clone-banner">Wild West Gold</div>
  <div id="stage"></div>
  <script src="js/slotConfig3x5.js"></script>
  <script src="js/mkutils.js"></script>
  <script src="js/popups.js"></script>
  <script src="js/state_machine.js"></script>
  <script src="js/slot_classes.js"></script>
  <script src="js/slotGame.js"></script>
  <script>
    // Move Phaser canvas into the scalable stage
    (function(){
      function move(){
        var s = document.getElementById('stage');
        var c = document.querySelector('body > canvas');
        if (s && c) { s.appendChild(c); return true; }
        return false;
      }
      var t = setInterval(function(){ if (move()) clearInterval(t); }, 100);
      setTimeout(function(){ clearInterval(t); }, 15000);
    })();
  </script>
  <script src="button-recolor.js"></script>
  <script src="phantom-bridge-integration.js"></script>
</body>
</html>
