<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scatter Bomb Slot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>💣 Scatter Bomb</h1>
<div id="slot"></div>
<div id="ui">
    <div id="bet-controls">
        <label>Bet: $</label>
        <input type="number" id="betInput" value="1" min="0.1" max="50" step="0.1">
        <div class="quick-bets">
            <button onclick="setBet(0.5)">$0.50</button>
            <button onclick="setBet(1)">$1</button>
            <button onclick="setBet(5)">$5</button>
            <button onclick="setBet(10)">$10</button>
        </div>
    </div>
    <button id="spinBtn" onclick="spin()">SPIN</button>
    <div id="balance">Balance: $0.00</div>
    <div id="winText"></div>
</div>
<div id="overlay"></div>
<script src="../bridge.js"></script>
<script src="math.js"></script>
<script src="game.js"></script>
</body>
</html>
