<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="/games/pirate-bay/">
<title>Egyptian Riches</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<style>
  html, body {
    width: 100%; height: 100%;
    padding: 0; margin: 0;
    overflow: hidden;
    position: relative;
    background: radial-gradient(ellipse at center, #5a3a08 0%, #170c02 100%);
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(253,224,71,0.22), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(180,120,40,0.20), transparent 45%),
      repeating-linear-gradient(45deg, rgba(253,224,71,0.22) 0 2px, transparent 2px 14px);
    pointer-events: none;
    z-index: 3;
  }
  /* Stage scaler — zooms canvas+UI on mobile so controls are reachable */
  #stage {
    position: fixed; inset: 0;
    transform-origin: center center;
    z-index: 2;
  }
  canvas {
    display: block;
    margin: 0;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    filter: hue-rotate(15deg) saturate(1.7) sepia(0.5) contrast(1.05);
  }
  /* Themed faint emblem watermark behind reels */
  .watermark {
    position: fixed; inset: 0;
    background: url("/games/egyptian-riches/emblem.png") center/35% no-repeat;
    opacity: 0.08; z-index: 1; pointer-events: none;
  }
  #clone-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    font-family: "Papyrus","Trajan Pro",serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 5px;
    color: #fff0b8;
    text-shadow: 0 0 14px #fde047, 0 0 4px #000, 2px 2px 0 #3a2008;
    pointer-events: none;
    text-transform: uppercase;
    background: linear-gradient(180deg, #3a2008cc, transparent);
    border-bottom: 2px solid #fde04766;
  }
  /* Mobile: scale the entire stage up so reels & buttons are bigger */
  @media (max-width: 600px) {
    #stage { transform: scale(1.25); }
    #clone-banner { font-size: 18px; height: 40px; letter-spacing: 4px; }
  }
  @media (max-width: 420px) {
    #stage { transform: scale(1.4); }
  }
</style>
<script src="js/phaser.js"></script>
<script src="../bridge.js"></script>
<script>window.__PB_CLONE_TITLE__ = "Egyptian Riches";</script>
<script>window.__PB_LOADER__={title:"EGYPTIAN RICHES",subtitle:"Unsealing the tomb…",emojis:["𓂀","🏺","🐪","☥"],bg:"radial-gradient(ellipse at center,#5a3a0a 0%,#1a1002 100%)",accent:"#ffd24a",accent2:"#c2410c",font:'"Cinzel","Trebuchet MS",serif',emblem:"/games/egyptian-riches/emblem.png"};</script>
<script src="loader.js"></script>
</head>
<body>
  <div class="watermark"></div>
  <div id="clone-banner">Egyptian Riches</div>
  <div id="stage"></div>
  <script src="js/slotConfig3x5.js"></script>
  <script src="js/mkutils.js"></script>
  <script src="js/popups.js"></script>
  <script src="js/state_machine.js"></script>
  <script src="js/slot_classes.js"></script>
  <script src="js/slotGame.js"></script>
  <script>
    // Move Phaser canvas into the scalable stage
    (function(){
      function move(){
        var s = document.getElementById('stage');
        var c = document.querySelector('body > canvas');
        if (s && c) { s.appendChild(c); return true; }
        return false;
      }
      var t = setInterval(function(){ if (move()) clearInterval(t); }, 100);
      setTimeout(function(){ clearInterval(t); }, 15000);
    })();
  </script>
  <script src="button-recolor.js"></script>
  <script src="phantom-bridge-integration.js"></script>
</body>
</html>
