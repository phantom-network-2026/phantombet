<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<base href="/games/pirate-bay/">
<title>Viking Voyage</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<style>
  body {
    background: radial-gradient(ellipse at center, #1a3a5e 0%, #02080f 100%);
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    padding: 0; margin: 0;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 30% 10%, rgba(125,211,252,0.22), transparent 40%),
      radial-gradient(circle at 70% 90%, rgba(255,255,255,0.10), transparent 45%),
      repeating-linear-gradient(135deg, rgba(125,211,252,0.05) 0 2px, transparent 2px 16px);
    pointer-events: none;
    z-index: 3;
  }
  canvas {
    display: block;
    margin: 0;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    filter: hue-rotate(195deg) saturate(1.4) brightness(0.95) contrast(1.1);
    z-index: 2;
  }
  .corner {
    position: fixed; width: 90px; height: 90px;
    background: url("/games/viking-voyage/emblem.png") center/contain no-repeat;
    opacity: 0.85;
    filter: drop-shadow(0 0 10px #7dd3fc);
    z-index: 5; pointer-events: none;
  }
  .corner.tl { top: 60px; left: 8px; }
  .corner.tr { top: 60px; right: 8px; transform: scaleX(-1); }
  .corner.bl { bottom: 8px; left: 8px; opacity: 0.5; }
  .corner.br { bottom: 8px; right: 8px; opacity: 0.5; transform: scaleX(-1); }
  .watermark {
    position: fixed; inset: 0;
    background: url("/games/viking-voyage/emblem.png") center/40% no-repeat;
    opacity: 0.07; z-index: 1; pointer-events: none;
  }
  #clone-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    font-family: "Cinzel", "Trebuchet MS", serif;
    font-weight: 900;
    font-size: 24px;
    letter-spacing: 6px;
    color: #cfeeff;
    text-shadow: 0 0 14px #7dd3fc, 0 0 4px #000, 2px 2px 0 #051428;
    pointer-events: none;
    text-transform: uppercase;
    background: linear-gradient(180deg, rgba(5,20,40,0.85), rgba(5,20,40,0));
    border-bottom: 2px solid rgba(125,211,252,0.4);
  }
</style>
<script src="js/phaser.js"></script>
<script src="../bridge.js"></script>
<script>window.__PB_CLONE_TITLE__ = "Viking Voyage";</script>
</head>
<body>
  <div class="watermark"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="clone-banner">Viking Voyage</div>
  <script src="js/slotConfig3x5.js"></script>
  <script src="js/mkutils.js"></script>
  <script src="js/popups.js"></script>
  <script src="js/state_machine.js"></script>
  <script src="js/slot_classes.js"></script>
  <script src="js/slotGame.js"></script>
  <script src="phantom-bridge-integration.js"></script>
</body>
</html>
