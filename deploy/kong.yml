# Kong gateway routing for the self-hosted Supabase stack.
# Mirrors the official Supabase docker setup so the JS client works unchanged.
_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths: [ /auth/v1/ ]
    plugins:
      - name: cors

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths: [ /rest/v1/ ]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: true }

  - name: realtime-v1
    url: http://realtime:4000/socket/
    protocol: http
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths: [ /realtime/v1/ ]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths: [ /storage/v1/ ]
    plugins:
      - name: cors

  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths: [ /functions/v1/ ]
    plugins:
      - name: cors